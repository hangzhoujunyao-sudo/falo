name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s server -v
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path backend/Cargo.toml --locked
      - run: cargo fmt --manifest-path backend/Cargo.toml --check
      - run: node --check frontend/main.js
      - run: node --check frontend/i18n.js
