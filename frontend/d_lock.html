<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="theme_color" name="theme-color" content="#0d1512" />
    <title>Falo — 已锁定</title>
    <link rel="stylesheet" href="lock.css?v=1.0.1" />
  </head>
  <body>
    <div class="lock-card">
      <img class="lock-brand" src="app-icon.svg" alt="" aria-hidden="true" />
      <div class="lock-glyph" aria-hidden="true">●</div>
      <h1>Falo 已锁定</h1>
      <p class="lock-copy">解锁后即可查看账号与消息窗口。</p>
      <input type="password" id="password" placeholder="密码" autocomplete="current-password" aria-label="密码" />
      <button id="unlock">解锁</button>
      <button id="biometric" class="secondary" hidden>使用生物识别</button>
      <p id="error" class="error" role="alert"></p>
      <a id="reset" href="#" class="reset">忘记密码？重置…</a>
    </div>
    <script src="theme.js?v=1.0.1"></script>
    <script src="confirm.js?v=2.6.4"></script>
    <script src="lock.js?v=1.0.1"></script>
  </body>
</html>
