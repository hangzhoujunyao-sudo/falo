<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="theme_color" name="theme-color" content="#f2f7f5" />
    <title>Falo — Sign in</title>
    <link rel="stylesheet" href="login.css?v=2.6.4" />
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card" data-tauri-drag-region>
        <button
          type="button"
          id="login-quit"
          class="login-quit"
          aria-label="Quit"
          title="Quit"
        >
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
            <path
              d="M1 1l10 10M11 1L1 11"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>

        <img class="login-brand" src="app-icon.svg" alt="" aria-hidden="true" />
        <h1 id="login-heading">Falo</h1>
        <p class="login-copy" id="login-subtitle">Sign in to continue</p>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" id="tab-login" role="tab" aria-selected="true">
            Sign in
          </button>
          <button type="button" class="auth-tab" id="tab-register" role="tab" aria-selected="false">
            Register
          </button>
        </div>

        <form class="auth-panel active" id="login-form" autocomplete="on" novalidate>
          <label class="login-field" for="login-email">
            <span id="label-login-email">Email</span>
            <input
              type="email"
              id="login-email"
              name="email"
              autocomplete="username"
              inputmode="email"
              required
              spellcheck="false"
            />
          </label>

          <label class="login-field" for="login-password">
            <span id="label-login-password">Password</span>
            <div class="password-wrap">
              <input
                type="password"
                id="login-password"
                name="password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="eye-btn"
                id="toggle-login-password"
                aria-label="Show password"
                aria-pressed="false"
                tabindex="-1"
              >
                <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 5c-5.5 0-9.5 4.5-10.8 6.3a1.2 1.2 0 0 0 0 1.4C2.5 14.5 6.5 19 12 19s9.5-4.5 10.8-6.3a1.2 1.2 0 0 0 0-1.4C21.5 9.5 17.5 5 12 5zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"
                  />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M3.3 2.2 2.2 3.3l3.1 3.1C3.6 7.7 2.1 9.5 1.2 11a1.2 1.2 0 0 0 0 1.4C2.5 14.5 6.5 19 12 19c1.8 0 3.4-.4 4.8-1.1l3.9 3.9 1.1-1.1L3.3 2.2zM12 17c-4.3 0-7.7-3.4-9-5.5.7-1.1 2-2.7 3.7-3.9l2.1 2.1A5 5 0 0 0 12 17zm.7-7.7 3 3A5 5 0 0 0 12.7 9.3zM21.9 11.3C20.9 9.8 18.2 6.7 14 5.5l1.7 1.7c1.7 1 3 2.5 3.7 3.6-.6 1-1.8 2.6-3.5 3.9l1.5 1.5c2.1-1.5 3.6-3.5 4.5-4.8a1.2 1.2 0 0 0 0-1.4z"
                  />
                </svg>
              </button>
            </div>
          </label>

          <button type="submit" id="login-submit" class="login-primary">Sign in</button>
        </form>

        <form class="auth-panel" id="register-form" autocomplete="on" novalidate hidden>
          <label class="login-field" for="register-email">
            <span id="label-register-email">Email</span>
            <input
              type="email"
              id="register-email"
              name="email"
              autocomplete="username"
              inputmode="email"
              required
              spellcheck="false"
            />
            <span id="register-email-error" class="field-error" hidden></span>
          </label>

          <label class="login-field" for="register-password">
            <span id="label-register-password">Password</span>
            <div class="password-wrap">
              <input
                type="password"
                id="register-password"
                name="password"
                autocomplete="new-password"
                required
                minlength="6"
              />
              <button
                type="button"
                class="eye-btn"
                id="toggle-register-password"
                aria-label="Show password"
                aria-pressed="false"
                tabindex="-1"
              >
                <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 5c-5.5 0-9.5 4.5-10.8 6.3a1.2 1.2 0 0 0 0 1.4C2.5 14.5 6.5 19 12 19s9.5-4.5 10.8-6.3a1.2 1.2 0 0 0 0-1.4C21.5 9.5 17.5 5 12 5zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"
                  />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M3.3 2.2 2.2 3.3l3.1 3.1C3.6 7.7 2.1 9.5 1.2 11a1.2 1.2 0 0 0 0 1.4C2.5 14.5 6.5 19 12 19c1.8 0 3.4-.4 4.8-1.1l3.9 3.9 1.1-1.1L3.3 2.2zM12 17c-4.3 0-7.7-3.4-9-5.5.7-1.1 2-2.7 3.7-3.9l2.1 2.1A5 5 0 0 0 12 17zm.7-7.7 3 3A5 5 0 0 0 12.7 9.3zM21.9 11.3C20.9 9.8 18.2 6.7 14 5.5l1.7 1.7c1.7 1 3 2.5 3.7 3.6-.6 1-1.8 2.6-3.5 3.9l1.5 1.5c2.1-1.5 3.6-3.5 4.5-4.8a1.2 1.2 0 0 0 0-1.4z"
                  />
                </svg>
              </button>
            </div>
          </label>

          <label class="login-field" for="register-confirm">
            <span id="label-register-confirm">Confirm password</span>
            <div class="password-wrap">
              <input
                type="password"
                id="register-confirm"
                name="confirm"
                autocomplete="new-password"
                required
                minlength="6"
              />
              <button
                type="button"
                class="eye-btn"
                id="toggle-register-confirm"
                aria-label="Show password"
                aria-pressed="false"
                tabindex="-1"
              >
                <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 5c-5.5 0-9.5 4.5-10.8 6.3a1.2 1.2 0 0 0 0 1.4C2.5 14.5 6.5 19 12 19s9.5-4.5 10.8-6.3a1.2 1.2 0 0 0 0-1.4C21.5 9.5 17.5 5 12 5zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"
                  />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M3.3 2.2 2.2 3.3l3.1 3.1C3.6 7.7 2.1 9.5 1.2 11a1.2 1.2 0 0 0 0 1.4C2.5 14.5 6.5 19 12 19c1.8 0 3.4-.4 4.8-1.1l3.9 3.9 1.1-1.1L3.3 2.2zM12 17c-4.3 0-7.7-3.4-9-5.5.7-1.1 2-2.7 3.7-3.9l2.1 2.1A5 5 0 0 0 12 17zm.7-7.7 3 3A5 5 0 0 0 12.7 9.3zM21.9 11.3C20.9 9.8 18.2 6.7 14 5.5l1.7 1.7c1.7 1 3 2.5 3.7 3.6-.6 1-1.8 2.6-3.5 3.9l1.5 1.5c2.1-1.5 3.6-3.5 4.5-4.8a1.2 1.2 0 0 0 0-1.4z"
                  />
                </svg>
              </button>
            </div>
          </label>

          <p class="login-hint" id="register-hint">New accounts start with a free trial.</p>
          <button type="submit" id="register-submit" class="login-primary">Create account</button>
        </form>

        <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
      </div>
    </div>

    <div id="device-limit-modal" class="device-limit-modal" hidden>
      <div class="device-limit-dialog" role="dialog" aria-modal="true" aria-labelledby="dl-title">
        <div class="device-limit-dialog-head">
          <h3 id="dl-title">Device limit reached</h3>
          <button type="button" id="dl-cancel" class="device-limit-close-btn" title="Close" aria-label="Close">&times;</button>
        </div>
        <p id="dl-desc" class="device-limit-desc">Sign out an old device, then try again.</p>
        <div class="device-limit-list-head">
          <strong id="dl-list-title">Signed-in devices</strong>
          <div class="device-limit-list-actions">
            <button type="button" id="dl-logout-all" class="device-remove-btn">Sign out all devices</button>
            <button type="button" id="dl-refresh" class="secondary">Refresh</button>
          </div>
        </div>
        <div class="device-select-toolbar" id="dl-select-toolbar">
          <label class="device-select-all-wrap">
            <input type="checkbox" id="dl-select-all" />
            <span id="dl-select-all-label">Select all</span>
          </label>
          <button type="button" id="dl-select-offline" class="secondary">Select offline</button>
          <button type="button" id="dl-logout-selected" class="device-remove-btn" disabled>Sign out selected</button>
        </div>
        <div id="dl-devices-list" class="devices-list"></div>
        <p id="dl-status" class="field-note device-limit-status" aria-live="polite"></p>
      </div>
    </div>

    <script src="theme.js?v=2.6.4"></script>
    <script src="confirm.js?v=2.6.4"></script>
    <script src="login.js?v=2.6.4"></script>
  </body>
</html>
